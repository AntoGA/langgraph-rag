[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "langgraph-rag-example"
version = "0.1.0"
description = "Bounded self-corrective RAG with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "AntoGA"}]
dependencies = [
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-anthropic>=1.0,<2",
  "pydantic-settings>=2.6,<3",
  "rank-bm25>=0.2.2,<0.3",
  "numpy>=1.26,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9,<1"]
embeddings = ["sentence-transformers>=3,<6"]

[project.scripts]
rag = "rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
